<script>

/* =========================================================
   NEWS DATA
========================================================= */

let articles = [];


/* =========================================================
   FILTER STATE
========================================================= */

let selectedDays = 7;

let selectedFilter = "all";


/* =========================================================
   READ ARTICLES
========================================================= */

let readArticles =
  JSON.parse(
    localStorage.getItem(
      "phillies-read"
    ) || "[]"
  );


/* =========================================================
   LOAD NEWS.JSON
========================================================= */

async function loadNews() {

  try {

    const response =
      await fetch(
        "news.json?time=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "news.json could not be loaded"
      );

    }


    const data =
      await response.json();


    articles =
      data.articles || [];


    render();


  } catch (error) {

    console.error(error);


    document
      .getElementById(
        "newsList"
      )
      .innerHTML = `

        <div class="empty">

          ニュースを取得できませんでした。<br>
          少し時間を置いて再読み込みしてください。

        </div>

      `;

  }

}


/* =========================================================
   REFRESH BUTTON
========================================================= */

const refreshButton =
  document.getElementById(
    "refreshButton"
  );


refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled = true;

    refreshButton.textContent =
      "↻ 更新中…";


    try {

      await loadNews();


      refreshButton.textContent =
        "✓ 更新完了";


      setTimeout(
        () => {

          refreshButton.textContent =
            "↻ 更新";

        },
        1500
      );


    } catch (error) {

      console.error(error);

      refreshButton.textContent =
        "更新失敗";


      setTimeout(
        () => {

          refreshButton.textContent =
            "↻ 更新";

        },
        2000
      );

    } finally {

      refreshButton.disabled = false;

    }

  }
);


/* =========================================================
   RENDER
========================================================= */

function render() {

  const now =
    new Date();


  const limit =
    selectedDays *
    24 *
    60 *
    60 *
    1000;


  /*
     公開日時が取得できている記事だけ
     期間フィルターの対象にする
  */

  let visible =
    articles.filter(
      article => {

        if (
          !article.published_at
        ) {

          return false;

        }


        const date =
          new Date(
            article.published_at
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return false;

        }


        return (
          now - date <= limit &&
          now - date >= 0
        );

      }
    );


  /* READ / UNREAD */

  if (
    selectedFilter === "read"
  ) {

    visible =
      visible.filter(
        article =>
          readArticles.includes(
            Number(article.id)
          )
      );

  }


  if (
    selectedFilter === "unread"
  ) {

    visible =
      visible.filter(
        article =>
          !readArticles.includes(
            Number(article.id)
          )
      );

  }


  /* TOTAL */

  document
    .getElementById(
      "total"
    )
    .textContent =
      visible.length;


  /* UNREAD */

  const unread =
    visible.filter(
      article =>
        !readArticles.includes(
          Number(article.id)
        )
    ).length;


  document
    .getElementById(
      "unread"
    )
    .textContent =
      unread;


  /* TODAY */

  const today =
    articles.filter(
      article => {

        if (
          !article.published_at
        ) {

          return false;

        }


        const date =
          new Date(
            article.published_at
          );


        return (
          !Number.isNaN(
            date.getTime()
          ) &&
          date.toDateString()
          ===
          now.toDateString()
        );

      }
    ).length;


  document
    .getElementById(
      "today"
    )
    .textContent =
      today;


  /* NEWS LIST */

  const container =
    document.getElementById(
      "newsList"
    );


  if (
    visible.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        該当するニュースはありません。

      </div>

    `;

    return;

  }


  /* 新しい記事を上にする */

  visible.sort(
    (a, b) => {

      const dateA =
        new Date(
          a.published_at
        );


      const dateB =
        new Date(
          b.published_at
        );


      return dateB - dateA;

    }
  );


  /* HTML生成 */

  container.innerHTML =

    visible.map(
      article => {

        const id =
          Number(
            article.id
          );


        const isRead =
          readArticles.includes(
            id
          );


        const title =
          article.title_ja ||
          article.title_en ||
          "タイトルなし";


        return `

          <article

            class="
              news-card
              ${isRead
                ? "read"
                : ""}
            "

            data-id="${id}"

          >

            <div
              class="news-indicator">
            </div>


            <div>

              <div
                class="news-source">

                ${escapeHTML(
                  article.source ||
                  "MLB.com"
                )}

              </div>


              <div
                class="news-title">

                ${escapeHTML(
                  title
                )}

              </div>


              <div
                class="news-meta">

                ${formatDate(
                  article.published_at
                )}

              </div>

            </div>


            <div

              class="
                news-status
                ${isRead
                  ? "read"
                  : "unread"}
              "

            >

              ${isRead
                ? "READ"
                : "UNREAD"}

            </div>


          </article>

        `;

      }
    ).join("");


  /* 記事クリック */

  document
    .querySelectorAll(
      ".news-card"
    )
    .forEach(
      card => {

        card.onclick = () => {

          const id =
            Number(
              card.dataset.id
            );


          const article =
            articles.find(
              item =>
                Number(item.id)
                ===
                id
            );


          if (!article) {

            return;

          }


          /* 既読 */

          if (
            !readArticles.includes(
              id
            )
          ) {

            readArticles.push(
              id
            );


            localStorage.setItem(
              "phillies-read",
              JSON.stringify(
                readArticles
              )
            );

          }


          /* 元記事 */

          if (
            article.url
          ) {

            window.open(
              article.url,
              "_blank"
            );

          }


          render();

        };

      }
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  if (!value) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value) {

  if (!value) {

    return "日時不明";

  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
