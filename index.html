```html
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Phillies | News Reader</title>

<style>

/* =========================
   BASE
========================= */

* {
  box-sizing: border-box;
}

:root {

  --red: #e81828;
  --red-dark: #c8102e;

  --blue: #002d72;
  --navy: #071b3a;

  --bg: #f3f4f6;
  --white: #ffffff;

  --text: #111827;
  --muted: #7a818c;

  --border: #e3e6eb;

}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  background: var(--bg);

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* =========================
   TOP BAR
========================= */

.topbar {

  height: 68px;

  background:
    linear-gradient(
      90deg,
      var(--red),
      #ed1c2e
    );

  color: white;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 28px;

  position: sticky;

  top: 0;

  z-index: 100;

  box-shadow:
    0 3px 15px rgba(0,0,0,.18);

}


.brand {

  display: flex;

  align-items: center;

  gap: 12px;

}


.brand-logo {

  width: 40px;

  height: 40px;

  background: white;

  color: var(--red);

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 25px;

  font-weight: 900;

}


.brand-name {

  font-size: 19px;

  font-weight: 900;

  letter-spacing: 2px;

}


.brand-sub {

  font-size: 8px;

  letter-spacing: 2px;

  opacity: .75;

}


.menu {

  width: 40px;

  height: 40px;

  border: 0;

  border-radius: 10px;

  background: rgba(255,255,255,.12);

  color: white;

  font-size: 22px;

}


/* =========================
   MAIN
========================= */

.container {

  max-width: 1080px;

  margin: auto;

  padding: 24px 18px 80px;

}


/* =========================
   HERO
========================= */

.hero {

  min-height: 260px;

  border-radius: 22px;

  overflow: hidden;

  position: relative;

  color: white;

  background:

    linear-gradient(
      135deg,
      #002d72 0%,
      #071b3a 100%
    );

  box-shadow:
    0 10px 35px rgba(0,45,114,.20);

}


.hero::before {

  content: "";

  position: absolute;

  width: 420px;

  height: 420px;

  border-radius: 50%;

  border:
    65px solid
    rgba(255,255,255,.035);

  right: -170px;

  top: -210px;

}


.hero::after {

  content: "";

  position: absolute;

  width: 200px;

  height: 200px;

  border-radius: 50%;

  border:
    30px solid
    rgba(232,24,40,.20);

  right: 80px;

  bottom: -140px;

}


.hero-content {

  position: relative;

  z-index: 2;

  padding: 38px;

}


.hero-tag {

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 3px;

  color: #cbd8ec;

}


.hero h1 {

  margin: 12px 0 8px;

  font-size:
    clamp(40px, 7vw, 68px);

  line-height: .95;

  letter-spacing: -3px;

}


.hero-description {

  margin: 0;

  color: #cbd8ec;

  font-size: 14px;

}


.hero-line {

  width: 60px;

  height: 4px;

  margin-top: 22px;

  background: var(--red);

  border-radius: 5px;

}


/* =========================
   STATS
========================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

  margin-top: 14px;

}


.stat {

  background: white;

  border: 1px solid var(--border);

  border-radius: 14px;

  padding: 17px 19px;

}


.stat-label {

  color: var(--muted);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1.5px;

}


.stat-number {

  margin-top: 4px;

  display: flex;

  align-items: baseline;

  gap: 6px;

}


.stat-number strong {

  font-size: 27px;

}


.stat-number span {

  color: var(--muted);

  font-size: 11px;

}


/* =========================
   TOOLBAR
========================= */

.toolbar {

  margin-top: 22px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;

}


.pills {

  display: flex;

  background: white;

  padding: 4px;

  border: 1px solid var(--border);

  border-radius: 11px;

}


.pill {

  border: 0;

  background: transparent;

  color: var(--muted);

  padding: 9px 15px;

  border-radius: 8px;

  font-size: 11px;

  font-weight: 800;

  cursor: pointer;

}


.pill:hover {

  background: #f0f2f5;

}


.pill.active {

  color: white;

  background: var(--blue);

}


/* =========================
   SECTION
========================= */

.section {

  margin-top: 28px;

}


.section-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 12px;

}


.section-title {

  display: flex;

  align-items: center;

  gap: 8px;

}


.red-dot {

  width: 8px;

  height: 8px;

  background: var(--red);

  border-radius: 50%;

}


.section-title h2 {

  margin: 0;

  font-size: 18px;

}


.reset {

  border: 0;

  background: transparent;

  color: var(--blue);

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;

}


/* =========================
   NEWS CARD
========================= */

.news-list {

  display: grid;

  gap: 8px;

}


.news-card {

  background: white;

  border: 1px solid var(--border);

  border-radius: 13px;

  padding: 17px;

  display: grid;

  grid-template-columns: 5px 1fr auto;

  gap: 15px;

  cursor: pointer;

  transition:
    transform .15s,
    box-shadow .15s,
    border .15s;

}


.news-card:hover {

  transform:
    translateY(-2px);

  border-color:
    #d0d5dc;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.07);

}


.news-line {

  background: var(--red);

  border-radius: 10px;

}


.news-card.read
.news-line {

  background: #cbd0d7;

}


.news-source {

  color: var(--red);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;

  margin-bottom: 5px;

}


.news-title {

  font-size: 15px;

  font-weight: 750;

  line-height: 1.5;

}


.news-card.read
.news-title {

  color: #858b94;

}


.news-info {

  margin-top: 7px;

  color: var(--muted);

  font-size: 10px;

}


.badge {

  align-self: center;

  border-radius: 20px;

  padding: 5px 9px;

  font-size: 9px;

  font-weight: 900;

  white-space: nowrap;

}


.badge.unread {

  color: var(--red);

  background: #fff0f1;

}


.badge.read {

  color: #777e88;

  background: #f1f2f4;

}


/* =========================
   EMPTY
========================= */

.empty {

  background: white;

  border: 1px dashed #cfd4da;

  border-radius: 14px;

  text-align: center;

  padding: 55px 20px;

  color: var(--muted);

  font-size: 13px;

}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {

  display: none;

}


/* =========================
   FOOTER
========================= */

.footer {

  max-width: 1080px;

  margin: auto;

  padding: 0 18px 35px;

  display: flex;

  justify-content: space-between;

  color: #9aa0a8;

  font-size: 9px;

  letter-spacing: 1px;

}


/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {


  .topbar {

    height: 62px;

    padding: 0 15px;

  }


  .brand-logo {

    width: 36px;

    height: 36px;

    font-size: 22px;

  }


  .brand-name {

    font-size: 16px;

  }


  .container {

    padding:
      12px
      11px
      85px;

  }


  .hero {

    min-height: 230px;

    border-radius: 17px;

  }


  .hero-content {

    padding: 28px 23px;

  }


  .hero h1 {

    font-size: 40px;

  }


  .stats {

    grid-template-columns:
      repeat(2, 1fr);

  }


  .stats .stat:last-child {

    display: none;

  }


  .toolbar {

    display: grid;

    gap: 7px;

  }


  .pills {

    width: 100%;

  }


  .pill {

    flex: 1;

    padding:
      10px
      4px;

  }


  .news-card {

    grid-template-columns:
      5px 1fr;

    padding: 15px;

  }


  .badge {

    display: none;

  }


  .news-title {

    font-size: 14px;

  }


  .bottom-nav {

    display: flex;

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 62px;

    background: white;

    border-top:
      1px solid var(--border);

    z-index: 200;

    justify-content:
      space-around;

    align-items: center;

  }


  .bottom-item {

    text-align: center;

    color: #9aa0a8;

    font-size: 9px;

    font-weight: 800;

  }


  .bottom-item.active {

    color: var(--red);

  }


  .bottom-icon {

    display: block;

    font-size: 18px;

    margin-bottom: 3px;

  }


  .footer {

    display: none;

  }

}

</style>

</head>



<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-logo">
      P
    </div>

    <div>

      <div class="brand-name">
        PHILLIES
      </div>

      <div class="brand-sub">
        NEWS READER
      </div>

    </div>

  </div>


  <button class="menu">
    ☰
  </button>

</header>



<main class="container">


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-content">

    <div class="hero-tag">
      PHILADELPHIA PHILLIES
    </div>

    <h1>
      Phillies<br>
      News
    </h1>

    <p class="hero-description">
      フィリーズ関連ニュースをまとめてチェック
    </p>

    <div class="hero-line"></div>

  </div>

</section>



<!-- =========================
     STATS
========================= -->

<section class="stats">


  <div class="stat">

    <div class="stat-label">
      TOTAL NEWS
    </div>

    <div class="stat-number">

      <strong id="total">
        6
      </strong>

      <span>
        ARTICLES
      </span>

    </div>

  </div>



  <div class="stat">

    <div class="stat-label">
      UNREAD
    </div>

    <div class="stat-number">

      <strong id="unread">
        6
      </strong>

      <span>
        ARTICLES
      </span>

    </div>

  </div>



  <div class="stat">

    <div class="stat-label">
      TODAY
    </div>

    <div class="stat-number">

      <strong>
        2
      </strong>

      <span>
        ARTICLES
      </span>

    </div>

  </div>


</section>



<!-- =========================
     FILTER
========================= -->

<section class="toolbar">


  <div class="pills">

    <button
      class="pill active"
      data-days="1">
      1日
    </button>

    <button
      class="pill"
      data-days="3">
      3日
    </button>

    <button
      class="pill"
      data-days="7">
      7日
    </button>

  </div>



  <div class="pills">

    <button
      class="pill active"
      data-filter="all">
      すべて
    </button>

    <button
      class="pill"
      data-filter="unread">
      未読
    </button>

    <button
      class="pill"
      data-filter="read">
      既読
    </button>

  </div>


</section>



<!-- =========================
     NEWS
========================= -->

<section class="section">


  <div class="section-top">

    <div class="section-title">

      <div class="red-dot"></div>

      <h2>
        Latest News
      </h2>

    </div>


    <button
      class="reset"
      id="reset">
      既読をリセット
    </button>

  </div>



  <div
    class="news-list"
    id="newsList">
  </div>


</section>


</main>



<!-- =========================
     MOBILE NAV
========================= -->

<nav class="bottom-nav">


  <div class="bottom-item active">

    <span class="bottom-icon">
      📰
    </span>

    NEWS

  </div>


  <div class="bottom-item">

    <span class="bottom-icon">
      ⚾
    </span>

    TEAM

  </div>


  <div class="bottom-item">

    <span class="bottom-icon">
      👤
    </span>

    PLAYERS

  </div>


  <div class="bottom-item">

    <span class="bottom-icon">
      ⚙
    </span>

    SETTINGS

  </div>


</nav>



<footer class="footer">

  <span>
    PHILLIES NEWS READER
  </span>

  <span>
    PERSONAL USE
  </span>

</footer>



<script>


/* =========================
   SAMPLE ARTICLES
========================= */


const articles = [

  {
    id: 1,
    days: 1,
    source: "MLB.COM",
    title:
      "Phillies continue to build around their core",
    time:
      "今日 10:20"
  },


  {
    id: 2,
    days: 1,
    source: "THE ATHLETIC",
    title:
      "What is working for Philadelphia right now?",
    time:
      "今日 08:45"
  },


  {
    id: 3,
    days: 2,
    source:
      "PHILADELPHIA INQUIRER",
    title:
      "Phillies prepare for another important series",
    time:
      "昨日 21:30"
  },


  {
    id: 4,
    days: 3,
    source: "MLB.COM",
    title:
      "Pitching staff showing signs of improvement",
    time:
      "8月8日 18:10"
  },


  {
    id: 5,
    days: 5,
    source:
      "FANRAG SPORTS",
    title:
      "The latest on the Phillies roster",
    time:
      "8月6日 12:05"
  },


  {
    id: 6,
    days: 7,
    source:
      "NBC SPORTS PHILADELPHIA",
    title:
      "Five things to watch around the Phillies",
    time:
      "8月3日 09:15"
  }

];



/* =========================
   STATE
========================= */


let days = 1;

let filter = "all";


let read =
  JSON.parse(
    localStorage.getItem(
      "phillies-read"
    ) || "[]"
  );



/* =========================
   RENDER
========================= */


function render() {


  let list =
    articles.filter(
      article =>
        article.days <= days
    );


  if (filter === "read") {

    list =
      list.filter(
        article =>
          read.includes(article.id)
      );

  }


  if (filter === "unread") {

    list =
      list.filter(
        article =>
          !read.includes(article.id)
      );

  }



  /* stats */


  const total =
    articles.filter(
      article =>
        article.days <= days
    ).length;


  const unread =
    articles.filter(
      article =>
        article.days <= days &&
        !read.includes(article.id)
    ).length;


  document
    .getElementById("total")
    .textContent = total;


  document
    .getElementById("unread")
    .textContent = unread;



  const container =
    document.getElementById(
      "newsList"
    );



  if (!list.length) {

    container.innerHTML = `

      <div class="empty">

        該当するニュースはありません。

      </div>

    `;

    return;

  }



  container.innerHTML =

    list.map(article => {


      const isRead =
        read.includes(
          article.id
        );


      return `

        <article
          class="
            news-card
            ${isRead ? "read" : ""}
          "
          data-id="${article.id}"
        >


          <div
            class="news-line">
          </div>


          <div>


            <div
              class="news-source">

              ${article.source}

            </div>


            <div
              class="news-title">

              ${article.title}

            </div>


            <div
              class="news-info">

              ${article.time}

            </div>


          </div>


          <div
            class="
              badge
              ${isRead
                ? "read"
                : "unread"}
            "
          >

            ${isRead
              ? "既読"
              : "未読"}

          </div>


        </article>

      `;

    }).join("");



  /* click */


  document
    .querySelectorAll(".news-card")
    .forEach(card => {


      card.onclick = () => {


        const id =
          Number(
            card.dataset.id
          );


        if (
          read.includes(id)
        ) {

          read =
            read.filter(
              x => x !== id
            );

        } else {

          read.push(id);

        }


        localStorage.setItem(
          "phillies-read",
          JSON.stringify(read)
        );


        render();

      };

    });

}



/* =========================
   PERIOD
========================= */


document
  .querySelectorAll(
    "[data-days]"
  )
  .forEach(button => {


    button.onclick = () => {


      days =
        Number(
          button.dataset.days
        );


      document
        .querySelectorAll(
          "[data-days]"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      render();

    };

  });



/* =========================
   FILTER
========================= */


document
  .querySelectorAll(
    "[data-filter]"
  )
  .forEach(button => {


    button.onclick = () => {


      filter =
        button.dataset.filter;


      document
        .querySelectorAll(
          "[data-filter]"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      render();

    };

  });



/* =========================
   RESET
========================= */


document
  .getElementById("reset")
  .onclick = () => {


    read = [];


    localStorage.removeItem(
      "phillies-read"
    );


    render();

  };



/* =========================
   START
========================= */


render();


</script>


</body>

</html>
```
