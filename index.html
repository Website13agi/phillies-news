<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Phillies News Reader</title>


<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

:root {

  --red: #e81828;
  --red-dark: #c8102e;

  --blue: #002d72;
  --navy: #061a36;

  --background: #f3f4f6;
  --white: #ffffff;

  --text: #101828;
  --muted: #737b88;

  --line: #e3e7ec;

}


body {

  margin: 0;

  background: var(--background);

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* =========================================================
   HEADER
========================================================= */

.header {

  height: 70px;

  background:
    linear-gradient(
      90deg,
      #d7192d 0%,
      #e81828 60%,
      #ef2434 100%
    );

  color: white;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 30px;

  position: sticky;

  top: 0;

  z-index: 100;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.18);

}


.brand {

  display: flex;

  align-items: center;

  gap: 12px;

}


.logo {

  width: 40px;

  height: 40px;

  border-radius: 50%;

  background: white;

  color: var(--red);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 25px;

  font-weight: 900;

}


.brand-title {

  font-size: 19px;

  font-weight: 900;

  letter-spacing: 2px;

}


.brand-subtitle {

  font-size: 8px;

  letter-spacing: 2px;

  opacity: .75;

}


.menu {

  width: 40px;

  height: 40px;

  border: 0;

  border-radius: 10px;

  background:
    rgba(255,255,255,.12);

  color: white;

  font-size: 21px;

}


/* =========================================================
   MAIN
========================================================= */

.main {

  max-width: 1080px;

  margin: auto;

  padding:
    24px
    18px
    90px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

  position: relative;

  overflow: hidden;

  min-height: 285px;

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      #002d72 0%,
      #071b3a 70%,
      #020b19 100%
    );

  color: white;

  box-shadow:
    0 12px 40px
    rgba(0,45,114,.20);

}


.hero::before {

  content: "";

  position: absolute;

  width: 480px;

  height: 480px;

  border-radius: 50%;

  border:
    70px solid
    rgba(255,255,255,.035);

  right: -200px;

  top: -260px;

}


.hero::after {

  content: "";

  position: absolute;

  width: 240px;

  height: 240px;

  border-radius: 50%;

  border:
    32px solid
    rgba(232,24,40,.18);

  right: 80px;

  bottom: -160px;

}


.hero-content {

  position: relative;

  z-index: 2;

  padding: 43px;

}


.hero-kicker {

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 3px;

  color:
    #bfcce0;

}


.hero-title {

  margin:
    12px 0
    10px;

  font-size:
    clamp(42px, 7vw, 70px);

  line-height: .9;

  letter-spacing: -4px;

}


.hero-description {

  margin: 0;

  color: #c6d2e4;

  font-size: 14px;

}


.hero-accent {

  width: 58px;

  height: 4px;

  margin-top: 24px;

  background: var(--red);

  border-radius: 10px;

}


/* =========================================================
   STATS
========================================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 13px;

}


.stat {

  background: white;

  border:
    1px solid
    var(--line);

  border-radius: 14px;

  padding: 18px 20px;

}


.stat-label {

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1.5px;

  color: var(--muted);

}


.stat-number {

  display: flex;

  align-items: baseline;

  gap: 6px;

  margin-top: 3px;

}


.stat-number strong {

  font-size: 28px;

}


.stat-number span {

  font-size: 10px;

  color: var(--muted);

}


/* =========================================================
   FILTER BAR
========================================================= */

.filter-area {

  margin-top: 23px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;

}


.filter-group {

  display: flex;

  gap: 3px;

  background: white;

  border:
    1px solid
    var(--line);

  padding: 4px;

  border-radius: 11px;

}


.filter-button {

  border: 0;

  background: transparent;

  color: var(--muted);

  padding:
    9px 15px;

  border-radius: 8px;

  font-size: 11px;

  font-weight: 800;

  cursor: pointer;

}


.filter-button:hover {

  background:
    #f1f3f5;

}


.filter-button.active {

  color: white;

  background: var(--blue);

}


/* =========================================================
   NEWS HEADER
========================================================= */

.news-header {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  margin-top: 30px;

  margin-bottom: 11px;

}


.news-heading {

  display: flex;

  align-items: center;

  gap: 9px;

}


.news-heading-dot {

  width: 8px;

  height: 8px;

  background: var(--red);

  border-radius: 50%;

}


.news-heading h2 {

  margin: 0;

  font-size: 18px;

}


.reset-button {

  border: 0;

  background: transparent;

  color: var(--blue);

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;

}


/* =========================================================
   NEWS LIST
========================================================= */

.news-list {

  display: grid;

  gap: 8px;

}


.news-card {

  background: white;

  border:
    1px solid
    var(--line);

  border-radius: 13px;

  padding:
    17px 18px;

  display: grid;

  grid-template-columns:
    5px
    minmax(0, 1fr)
    auto;

  gap: 15px;

  cursor: pointer;

  transition:
    transform .14s ease,
    box-shadow .14s ease,
    border-color .14s ease;

}


.news-card:hover {

  transform:
    translateY(-2px);

  border-color:
    #d0d5dc;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.07);

}


.news-indicator {

  background:
    var(--red);

  border-radius: 10px;

}


.news-card.read
.news-indicator {

  background:
    #cbd0d7;

}


.news-source {

  color: var(--red);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;

  margin-bottom: 5px;

}


.news-title {

  font-size: 15px;

  font-weight: 750;

  line-height: 1.5;

}


.news-card.read
.news-title {

  color:
    #858b94;

}


.news-meta {

  display: flex;

  gap: 10px;

  margin-top: 7px;

  color: var(--muted);

  font-size: 10px;

}


.news-status {

  align-self: center;

  padding:
    5px 9px;

  border-radius: 20px;

  font-size: 9px;

  font-weight: 900;

  white-space: nowrap;

}


.news-status.unread {

  color: var(--red);

  background:
    #fff0f1;

}


.news-status.read {

  color: #777e88;

  background:
    #f1f2f4;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

  background: white;

  border:
    1px dashed
    #cdd3da;

  border-radius: 14px;

  padding: 55px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;

}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-nav {

  display: none;

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

  max-width: 1080px;

  margin: auto;

  padding:
    0 18px
    35px;

  display: flex;

  justify-content:
    space-between;

  color:
    #9aa1aa;

  font-size: 9px;

  letter-spacing: 1px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {


  .header {

    height: 62px;

    padding:
      0 15px;

  }


  .logo {

    width: 36px;

    height: 36px;

    font-size: 22px;

  }


  .brand-title {

    font-size: 16px;

  }


  .main {

    padding:
      12px
      11px
      82px;

  }


  .hero {

    min-height: 245px;

    border-radius: 17px;

  }


  .hero-content {

    padding:
      31px 24px;

  }


  .hero-title {

    font-size: 42px;

    letter-spacing:
      -2.5px;

  }


  .stats {

    grid-template-columns:
      repeat(2, 1fr);

  }


  .stat:last-child {

    display: none;

  }


  .stat {

    padding:
      15px;

  }


  .stat-number strong {

    font-size: 24px;

  }


  .filter-area {

    display: grid;

    gap: 7px;

  }


  .filter-group {

    width: 100%;

  }


  .filter-button {

    flex: 1;

    padding:
      10px 4px;

  }


  .news-card {

    grid-template-columns:
      5px
      minmax(0, 1fr);

    padding:
      15px;

  }


  .news-status {

    display: none;

  }


  .news-title {

    font-size: 14px;

  }


  .mobile-nav {

    position: fixed;

    display: flex;

    bottom: 0;

    left: 0;

    right: 0;

    height: 62px;

    background: white;

    border-top:
      1px solid
      var(--line);

    z-index: 200;

    justify-content:
      space-around;

    align-items: center;

  }


  .mobile-nav-item {

    text-align: center;

    color: #9299a3;

    font-size: 8px;

    font-weight: 900;

  }


  .mobile-nav-item.active {

    color: var(--red);

  }


  .mobile-icon {

    display: block;

    font-size: 18px;

    margin-bottom: 3px;

  }


  .footer {

    display: none;

  }

}

</style>

</head>



<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


  <div class="brand">


    <div class="logo">
      P
    </div>


    <div>

      <div class="brand-title">
        PHILLIES
      </div>

      <div class="brand-subtitle">
        NEWS READER
      </div>

    </div>


  </div>


  <button class="menu">
    ☰
  </button>


</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<!-- HERO -->

<section class="hero">


  <div class="hero-content">


    <div class="hero-kicker">
      PHILADELPHIA PHILLIES
    </div>


    <h1 class="hero-title">

      Phillies<br>
      News

    </h1>


    <p class="hero-description">

      フィリーズ関連ニュースを
      まとめてチェック

    </p>


    <div class="hero-accent"></div>


  </div>


</section>



<!-- STATS -->

<section class="stats">


  <div class="stat">

    <div class="stat-label">
      TOTAL NEWS
    </div>


    <div class="stat-number">

      <strong id="total">
        6
      </strong>

      <span>
        ARTICLES
      </span>

    </div>

  </div>



  <div class="stat">

    <div class="stat-label">

    </div>


    <div class="stat-number">

      <strong id="unread">
        6
      </strong>

      <span>
        ARTICLES
      </span>

    </div>

  </div>



  <div class="stat">

    <div class="stat-label">
      TODAY
    </div>


    <div class="stat-number">

      <strong>
        2
      </strong>

      <span>

      </span>

    </div>

  </div>

<!-- FILTERS -->

<section class="filter-area">


  <div class="filter-group">


    <button
      class="filter-button active"
      data-days="1">

      1 DAY

    </button>


    <button
      class="filter-button"
      data-days="3">

      3 DAYS

    </button>


    <button
      class="filter-button"
      data-days="7">

      7 DAYS

    </button>

      class="filter-button active"
      data-filter="all">

  </span>

  </span>


</footer>



<script>


/* =====================================================
   SAMPLE DATA
===================================================== */


const articles = [


  {
    id: 1,
    days: 1,
    source: "MLB.COM",
    title:
      "Phillies continue to build around their core",
    time:
      "Today · 10:20"
  },


  {
    id: 2,
    days: 1,
    source: "THE ATHLETIC",
    title:
      "What is working for Philadelphia right now?",
    time:
      "Today · 08:45"
  },


  {
    id: 3,
    days: 2,
    source:
      "PHILADELPHIA INQUIRER",
    title:
      "Phillies prepare for another important series",
    time:
      "Yesterday · 21:30"
  },


  {
    id: 4,
    days: 3,
    source:
      "MLB.COM",
    title:
      "Pitching staff showing signs of improvement",
    time:
      "Aug 8 · 18:10"
  },


  {
    id: 5,
    days: 5,
    source:
      "FANRAG SPORTS",
    title:
      "The latest on the Phillies roster",
    time:
      "Aug 6 · 12:05"
  },


  {
    id: 6,
    days: 7,
    source:
      "NBC SPORTS PHILADELPHIA",
    title:
      "Five things to watch around the Phillies",
    time:
      "Aug 3 · 09:15"
  }

];



/* =====================================================
   STATE
===================================================== */


let selectedDays = 1;

let selectedFilter = "all";


let readArticles =
  JSON.parse(
    localStorage.getItem(
      "phillies-read"
    ) || "[]"
  );



/* =====================================================
   RENDER
===================================================== */


function render() {


  let visible =
    articles.filter(
      article =>
        article.days <= selectedDays
    );


  if (
    selectedFilter === "read"
  ) {

    visible =
      visible.filter(
        article =>
          readArticles.includes(
            article.id
          )
      );

  }


  if (
    selectedFilter === "unread"
  ) {

    visible =
      visible.filter(
        article =>
          !readArticles.includes(
            article.id
          )
      );

  }



  /* TOTAL */


  const total =
    articles.filter(
      article =>
        article.days <= selectedDays
    ).length;


  /* UNREAD */


  const unread =
    articles.filter(
      article =>
        article.days <= selectedDays &&
        !readArticles.includes(
          article.id
        )
    ).length;


  document
    .getElementById("total")
    .textContent =
      total;


  document
    .getElementById("unread")
    .textContent =
      unread;



  const container =
    document.getElementById(
      "newsList"
    );



  if (
    visible.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        該当するニュースはありません。

      </div>

    `;

    return;

  }



  container.innerHTML =

    visible.map(
      article => {


        const isRead =
          readArticles.includes(
            article.id
          );


        return `

          <article
            class="
              news-card
              ${isRead
                ? "read"
                : ""}
            "
            data-id="${article.id}"
          >


            <div
              class="
                news-indicator
              ">
            </div>


            <div>


              <div
                class="
                  news-source
                ">

                ${article.source}

              </div>


              <div
                class="
                  news-title
                ">

                ${article.title}

              </div>


              <div
                class="
                  news-meta
                ">

                ${article.time}

              </div>


            </div>


            <div
              class="
                news-status
                ${isRead
                  ? "read"
                  : "unread"}
              ">

              ${isRead
                ? "READ"
                : "UNREAD"}

            </div>


          </article>

        `;

      }
    ).join("");



  /* ARTICLE CLICK */


  document
    .querySelectorAll(
      ".news-card"
    )
    .forEach(card => {


      card.onclick = () => {


        const id =
          Number(
            card.dataset.id
          );


        if (
          readArticles.includes(id)
        ) {

          readArticles =
            readArticles.filter(
              x =>
                x !== id
            );

        } else {

          readArticles.push(id);

        }


        localStorage.setItem(
          "phillies-read",
          JSON.stringify(
            readArticles
          )
        );


        render();

      };

    });

}



/* =====================================================
   DAY FILTER
===================================================== */


document
  .querySelectorAll(
    "[data-days]"
  )
  .forEach(button => {


    button.onclick = () => {


      selectedDays =
        Number(
          button.dataset.days
        );


      document
        .querySelectorAll(
          "[data-days]"
        )
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      render();

    };

  });



/* =====================================================
   READ FILTER
===================================================== */


document
  .querySelectorAll(
    "[data-filter]"
  )
  .forEach(button => {


    button.onclick = () => {


      selectedFilter =
        button.dataset.filter;


      document
        .querySelectorAll(
          "[data-filter]"
        )
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      render();

    };

  });



/* =====================================================
   RESET
===================================================== */


document
  .getElementById(
    "reset"
  )
  .onclick = () => {


    readArticles = [];


    localStorage.removeItem(
      "phillies-read"
    );


    render();

  };



/* =====================================================
   START
===================================================== */


render();


</script>


</body>

</html>
